<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>JOSI MAKEUP — Subir fotos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600&family=Jost:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --coffee: #3a2e2c;
        --taupe: #8a7a72;
        --cream: #faf8f5;
        --champagne: #c9a876;
        --border: rgba(58, 46, 44, 0.18);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--cream);
        color: var(--coffee);
        font-family: 'Jost', sans-serif;
        line-height: 1.5;
      }
      .wrap {
        max-width: 760px;
        margin: 0 auto;
        padding: 48px 24px 96px;
      }
      h1 {
        font-family: 'Cormorant Garamond', serif;
        font-weight: 500;
        font-size: 2.25rem;
        margin: 0 0 32px;
      }
      .password-gate {
        position: fixed;
        inset: 0;
        background: var(--cream);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 1000;
      }
      .password-box {
        border: 1px solid var(--border);
        padding: 32px;
        max-width: 320px;
        width: 100%;
      }
      .password-label {
        font-size: 0.65rem;
        text-transform: uppercase;
        letter-spacing: 0.15em;
        color: var(--taupe);
        margin: 0 0 12px;
      }
      .password-error {
        margin-top: 10px;
        font-size: 0.78rem;
        color: #a33;
        min-height: 1em;
      }
      .hidden {
        display: none !important;
      }
      #token-toggle {
        margin-bottom: 12px;
      }
      .token-box {
        display: none;
        border: 1px solid var(--border);
        padding: 14px 16px;
        margin-bottom: 28px;
        max-width: 360px;
      }
      .token-box.open {
        display: block;
      }
      .token-row {
        display: flex;
        gap: 10px;
      }
      input[type='password'],
      input[type='text'] {
        flex: 1;
        min-width: 0;
        border: 0;
        border-bottom: 1px solid var(--border);
        background: transparent;
        padding: 10px 2px;
        font-family: 'Jost', sans-serif;
        font-size: 0.9rem;
        color: var(--coffee);
      }
      input:focus {
        outline: none;
        border-bottom-color: var(--coffee);
      }
      button {
        font-family: 'Jost', sans-serif;
        font-size: 0.72rem;
        font-weight: 500;
        text-transform: uppercase;
        letter-spacing: 0.15em;
        border: 1px solid var(--coffee);
        background: var(--coffee);
        color: var(--cream);
        padding: 10px 20px;
        cursor: pointer;
      }
      button:hover {
        background: transparent;
        color: var(--coffee);
      }
      button:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
      button.secondary {
        background: transparent;
        color: var(--coffee);
      }
      .token-status {
        margin-top: 10px;
        font-size: 0.78rem;
        color: var(--taupe);
      }
      .slot {
        display: grid;
        grid-template-columns: 90px 1fr auto;
        gap: 16px;
        align-items: center;
        padding: 16px 0;
        border-bottom: 1px solid var(--border);
      }
      .thumb {
        width: 90px;
        height: 90px;
        object-fit: cover;
        border: 1px solid var(--border);
        background: #ece6e0;
        display: block;
      }
      .thumb-empty {
        width: 90px;
        height: 90px;
        border: 1px solid var(--border);
        background: #ece6e0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 0.6rem;
        color: var(--taupe);
        text-align: center;
        padding: 4px;
      }
      .slot-label {
        font-size: 0.92rem;
      }
      .slot-alt {
        font-size: 0.75rem;
        color: var(--taupe);
        margin-top: 2px;
      }
      .caption-row {
        display: flex;
        gap: 8px;
        align-items: center;
        margin-top: 8px;
        max-width: 260px;
      }
      .caption-row input[type='text'] {
        font-size: 0.8rem;
      }
      .slot-actions {
        display: flex;
        flex-direction: column;
        gap: 8px;
        align-items: flex-end;
      }
      .slot-status {
        font-size: 0.72rem;
        margin-top: 4px;
        max-width: 220px;
        text-align: right;
      }
      .slot-status.error {
        color: #a33;
      }
      .slot-status.ok {
        color: #3a7a4a;
      }
      input[type='file'] {
        font-size: 0.72rem;
        max-width: 160px;
      }
      .position-panel {
        display: none;
        grid-column: 1 / -1;
        margin-top: 12px;
        padding-top: 16px;
        border-top: 1px dashed var(--border);
        gap: 20px;
        flex-wrap: wrap;
      }
      .position-panel.open {
        display: flex;
      }
      .crop-stage {
        position: relative;
        width: 100%;
        max-width: 300px;
        overflow: hidden;
        border: 1px solid var(--border);
        cursor: grab;
        touch-action: none;
        user-select: none;
      }
      .crop-stage.dragging {
        cursor: grabbing;
      }
      .crop-stage img {
        position: absolute;
        top: 0;
        left: 0;
        pointer-events: none;
      }
      .position-actions {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 8px;
      }
      .position-hint {
        font-size: 0.72rem;
        color: var(--taupe);
        max-width: 240px;
        margin: 0;
      }
      #slots {
        display: none;
      }
      #slots.ready {
        display: block;
      }
      button.danger {
        border-color: #a33;
        color: #a33;
      }
      button.danger:hover {
        background: #a33;
        color: var(--cream);
      }
      .category-picker {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin: 12px 0;
      }
      .category-picker button {
        padding: 8px 14px;
      }
      .category-picker button.selected {
        background: var(--coffee);
        color: var(--cream);
      }
      .add-photo-box {
        margin-top: 20px;
        padding-top: 20px;
        border-top: 1px solid var(--border);
      }
      .add-photo-hint {
        font-size: 0.78rem;
        color: var(--taupe);
        margin: 0 0 4px;
      }
    </style>
  </head>
  <body>
    <div class="password-gate" id="password-gate">
      <div class="password-box">
        <p class="password-label">Contraseña</p>
        <div class="token-row">
          <input id="password-input" type="password" autocomplete="off" />
          <button id="password-submit">Entrar</button>
        </div>
        <p class="password-error" id="password-error"></p>
      </div>
    </div>

    <div class="wrap hidden" id="app-content">
      <h1>Subir fotos</h1>

      <button id="token-toggle" class="secondary" type="button">Token de GitHub</button>
      <div class="token-box" id="token-box">
        <div class="token-row" id="token-row">
          <input id="token-input" type="password" placeholder="github_pat_..." autocomplete="off" />
          <button id="save-token">Guardar</button>
        </div>
        <p class="token-status" id="token-status"></p>
      </div>

      <div id="slots"></div>

      <h1 style="margin-top: 56px">Portafolio</h1>
      <div id="portfolio-slots"></div>
      <div id="portfolio-add"></div>
    </div>

    <script>
      const REPO_OWNER = 'nanifranco'
      const REPO_NAME = 'josi-makeup-mx'
      const BRANCH = 'main'
      const RAW_BASE = `https://raw.githubusercontent.com/${REPO_OWNER}/${REPO_NAME}/${BRANCH}/`
      const API_BASE = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/`
      const SITE_ORIGIN = 'https://nanifranco.github.io'
      const TOKEN_KEY = 'josi_admin_github_token'

      // "aspect" es el ancho entre alto real del espacio donde se ve cada foto en el sitio
      // (el mismo que usan las clases aspect-[...] de cada sección) — con eso el recuadro
      // de "Centrar" muestra el tamaño real, no uno inventado.
      const SLOTS = [
        { id: 'hero', label: 'Hero (portada)', file: 'src/content/hero.json', path: ['image'], aspect: 4 / 5 },
        { id: 'about', label: 'Sobre mí', file: 'src/content/about.json', path: ['photoMain'], aspect: 1 },
        { id: 'service-social', label: 'Servicios — Maquillaje social', file: 'src/content/services.json', path: ['items', 0, 'image'], aspect: 4 / 3 },
        { id: 'service-infantil', label: 'Servicios — Fiestas infantiles', file: 'src/content/services.json', path: ['items', 1, 'image'], aspect: 4 / 3 },
        { id: 'service-caracterizacion', label: 'Servicios — Caracterización', file: 'src/content/services.json', path: ['items', 2, 'image'], aspect: 4 / 3 },
      ]

      // El portafolio ya no es una lista fija de casillas: se lee directamente de
      // portfolio.json y cada foto se identifica por su "id" (no por su posición en el
      // arreglo), para poder agregar y eliminar fotos desde aquí sin romper nada.
      const PORTFOLIO_FILE = 'src/content/portfolio.json'
      const PORTFOLIO_CATEGORIES = [
        { value: 'social', label: 'Social' },
        { value: 'infantil', label: 'Infantil' },
        { value: 'caracterizacion', label: 'Caracterización' },
      ]
      const PORTFOLIO_SIZES = [
        { value: 'chica', label: 'Chica' },
        { value: 'grande', label: 'Grande' },
      ]

      // Debe coincidir exactamente con aspectClassFor() en Portfolio.tsx para que el
      // recuadro de "Centrar" muestre el tamaño real donde se vera la foto en el sitio.
      function aspectForOrientation(orientation, size) {
        if (size === undefined) {
          return orientation === 'vertical' ? 3 / 4 : 4 / 3
        }
        return size === 'grande' ? 3 / 4 : 4 / 3
      }

      /** "slot" cuyo target es la foto (image) de un item del portafolio, buscado por id. */
      function portfolioImageSlot(itemId, label) {
        return {
          id: itemId,
          file: PORTFOLIO_FILE,
          label,
          resolveTarget: (root) => {
            const item = (root.items || []).find((i) => i.id === itemId)
            return item ? item.image : null
          },
        }
      }

      /** "slot" cuyo target es el item completo del portafolio (para tocar "orientation"). */
      function portfolioItemSlot(itemId, label) {
        return {
          file: PORTFOLIO_FILE,
          label,
          resolveTarget: (root) => (root.items || []).find((i) => i.id === itemId) || null,
        }
      }

      /** "slot" cuyo target es todo portfolio.json (para agregar/quitar fotos del arreglo). */
      function portfolioRootSlot(label) {
        return { file: PORTFOLIO_FILE, label, path: [] }
      }

      /** Detecta si una foto es vertical Uu horizontal a partir de sus dimensiones reales. */
      function detectOrientation(file) {
        return new Promise((resolve) => {
          const img = new Image()
          img.onload = () => {
            resolve(img.naturalWidth > img.naturalHeight ? 'horizontal' : 'vertical')
            URL.revokeObjectURL(img.src)
          }
          img.onerror = () => resolve('vertical')
          img.src = URL.createObjectURL(file)
        })
      }

      const walk = (obj, path) => path.reduce((node, key) => (node == null ? node : node[key]), obj)

      const utf8ToBase64 = (str) => {
        const bytes = new TextEncoder().encode(str)
        let binary = ''
        bytes.forEach((byte) => {
          binary += String.fromCharCode(byte)
        })
        return btoa(binary)
      }

      const base64ToUtf8 = (base64) => {
        const binary = atob(base64.replace(/\n/g, ''))
        const bytes = Uint8Array.from(binary, (char) => char.charCodeAt(0))
        return new TextDecoder('utf-8').decode(bytes)
      }

      const fileToBase64 = (file) =>
        new Promise((resolve, reject) => {
          const reader = new FileReader()
          reader.onload = () => resolve(reader.result.split(',')[1])
          reader.onerror = reject
          reader.readAsDataURL(file)
        })

      function getToken() {
        return localStorage.getItem(TOKEN_KEY) || ''
      }

      function setStatus(el, message, kind) {
        el.textContent = message
        el.className = 'slot-status' + (kind ? ' ' + kind : '')
      }

      async function fetchJson(file) {
        const response = await fetch(RAW_BASE + file + '?t=' + Date.now())
        if (!response.ok) throw new Error('No se pudo leer ' + file)
        return response.json()
      }

      async function getFileSha(file, token) {
        const response = await fetch(API_BASE + file + '?ref=' + BRANCH, {
          headers: { Authorization: 'Bearer ' + token, Accept: 'application/vnd.github+json' },
        })
        if (!response.ok) throw new Error('No se pudo leer ' + file + ' desde GitHub (revisa el token).')
        const data = await response.json()
        return { sha: data.sha, content: JSON.parse(base64ToUtf8(data.content)) }
      }

      async function putFile(file, token, base64Content, sha, message) {
        const body = { message, content: base64Content, branch: BRANCH }
        if (sha) body.sha = sha
        const response = await fetch(API_BASE + file, {
          method: 'PUT',
          headers: {
            Authorization: 'Bearer ' + token,
            Accept: 'application/vnd.github+json',
            'Content-Type': 'application/json',
          },
          body: JSON.stringify(body),
        })
        if (!response.ok) {
          const errText = await response.text().catch(() => '')
          const error = new Error('GitHub rechazó el cambio en ' + file + ' (' + response.status + '). ' + errText.slice(0, 200))
          error.status = response.status
          throw error
        }
        return response.json()
      }

      const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms))

      // Dos escrituras casi al mismo tiempo (dos fotos, o una foto y un "Centrar") pueden
      // pisarse si ambas leen el mismo JSON antes de que la primera termine de guardarlo.
      // Esto pasaba incluso hacienda una tarea, refrescando, y haciendo otra — porque el
      // panel puede quedar abierto en más de una pestaña/ventana a la vez, y una simple
      // cola en memoria de JS no se comparte entre pestañas. Web Locks sí es compartido
      // por el navegador entre todas las pestañas del mismo sitio, así que todas las
      // escrituras a GitHub (sin importar en qué pestaña o botón se hayan iniciado) se
      // hacen una por una de verdad.
      const WRITE_LOCK_NAME = 'josi-admin-github-write'
      let fallbackQueue = Promise.resolve()

      function enqueueWrite(task) {
        if (navigator.locks && navigator.locks.request) {
          return navigator.locks.request(WRITE_LOCK_NAME, task)
        }
        // Respaldo para navegadores sin Web Locks API: al menos serializa dentro de esta pestaña.
        const run = fallbackQueue.then(task, task)
        fallbackQueue = run.catch(() => {})
        return run
      }

      // Aunque todas las escrituras a GitHub ya se hacen una por una (ver enqueueWrite),
      // seguíamos viendo 409 entre tareas seguidas: pedirle a GitHub el sha "actual" justo
      // después de haber escrito puede tardar un instante en reflejar ese cambio. En vez de
      // confiar en esa lectura, guardamos el sha+contenido que YA sabemos correctos porque
      // los acabamos de escribir nosotros mismos, y solo pedimos una lectura fresca la
      // primera vez que tocamos un archivo (o si algo externo lo cambió y por eso da 409).
      const lastKnownFile = new Map()

      async function updateJsonField(slot, token, mutate) {
        const MAX_ATTEMPTS = 6
        for (let attempt = 1; attempt <= MAX_ATTEMPTS; attempt++) {
          const cached = attempt === 1 ? lastKnownFile.get(slot.file) : null
          const { sha, content } = cached
            ? { sha: cached.sha, content: JSON.parse(JSON.stringify(cached.content)) }
            : await getFileSha(slot.file, token)

          const target = slot.resolveTarget ? slot.resolveTarget(content) : walk(content, slot.path)
          if (!target) throw new Error('No se encontró el campo esperado en ' + slot.file)
          mutate(target)

          const newJsonBase64 = utf8ToBase64(JSON.stringify(content, null, 2) + '\n')
          try {
            const result = await putFile(slot.file, token, newJsonBase64, sha, `Actualizar foto: ${slot.label}`)
            const newSha = result && result.content && result.content.sha
            if (newSha) lastKnownFile.set(slot.file, { sha: newSha, content })
            return
          } catch (error) {
            const isConflict = error.status === 409
            if (isConflict) lastKnownFile.delete(slot.file)
            if (!isConflict || attempt === MAX_ATTEMPTS) throw error
            await wait(400 * attempt)
          }
        }
      }

      async function uploadPhoto(slot, file, statusEl, previewImg, uploadBtn, emptyThumb, fileInput) {
        const token = getToken()
        if (!token) {
          setStatus(statusEl, 'Primero guarda tu token de GitHub arriba.', 'error')
          return
        }

        uploadBtn.disabled = true
        setStatus(statusEl, 'Subiendo…', '')

        try {
          await enqueueWrite(async () => {
            const ext = (file.name.split('.').pop() || 'jpg').toLowerCase()
            const imagePath = `public/images/uploads/${slot.id}-${Date.now()}.${ext}`
            const imageBase64 = await fileToBase64(file)

            await putFile(imagePath, token, imageBase64, null, `Subir foto: ${slot.label}`)
            await updateJsonField(slot, token, (target) => {
              target.src = '/josi-makeup-mx/' + imagePath.replace(/^public\//, '')
            })
          })

          // Sin esto, un slot que empezaba vacío se quedaba mostrando "Sin foto" y el
          // botón "Centrar" seguía rechazando la acción hasta refrescar la página,
          // aunque la subida ya hubiera funcionado.
          previewImg.src = URL.createObjectURL(file)
          previewImg.style.display = 'block'
          emptyThumb.style.display = 'none'
          fileInput.value = ''
          setStatus(statusEl, 'Listo — se publicará en unos minutos.', 'ok')
        } catch (error) {
          setStatus(statusEl, error.message || 'Ocurrió un error al subir la foto.', 'error')
        } finally {
          uploadBtn.disabled = false
        }
      }

      function parsePosition(value) {
        const match = /^\s*(\d+(?:\.\d+)?)%\s+(\d+(?:\.\d+)?)%\s*$/.exec(value || '')
        if (!match) return { x: 50, y: 50 }
        return { x: Number(match[1]), y: Number(match[2]) }
      }

      /**
       * Panel para elegir qué parte de la foto entra en su espacio real. El recuadro
       * (stage) tiene la forma exacta del cuadrito donde se verá en el sitio (según
       * slot.aspect) y se queda fijo; la foto se arrastra por debajo, igual que un
       * editor de foto de perfil — sin marcas ni puntos superpuestos.
       */
      function createPositionPanel(slot, onSave) {
        const panel = document.createElement('div')
        panel.className = 'position-panel'

        const stage = document.createElement('div')
        stage.className = 'crop-stage'
        let aspect = slot.aspect || 1
        stage.style.aspectRatio = String(aspect)
        const img = document.createElement('img')
        stage.appendChild(img)

        const actions = document.createElement('div')
        actions.className = 'position-actions'
        const hint = document.createElement('p')
        hint.className = 'position-hint'
        hint.textContent = 'Arrastra la foto — el recuadro es el tamaño real donde se vera en el sitio.'
        const saveBtn = document.createElement('button')
        saveBtn.className = 'secondary'
        saveBtn.textContent = 'Guardar posición'
        const resetBtn = document.createElement('button')
        resetBtn.className = 'secondary'
        resetBtn.textContent = 'Restablecer centro'
        const posStatus = document.createElement('p')
        posStatus.className = 'slot-status'

        actions.appendChild(hint)
        actions.appendChild(saveBtn)
        actions.appendChild(resetBtn)
        actions.appendChild(posStatus)

        panel.appendChild(stage)
        panel.appendChild(actions)

        let pending = { x: 50, y: 50 }

        function coverSize() {
          const stageRect = stage.getBoundingClientRect()
          const stageW = stageRect.width
          const stageH = stageRect.height
          const naturalW = img.naturalWidth
          const naturalH = img.naturalHeight
          if (!stageW || !stageH || !naturalW || !naturalH) return null
          const naturalAspect = naturalW / naturalH
          let imgW
          let imgH
          if (naturalAspect > aspect) {
            imgH = stageH
            imgW = stageH * naturalAspect
          } else {
            imgW = stageW
            imgH = stageW / naturalAspect
          }
          return { stageW, stageH, imgW, imgH }
        }

        function layout() {
          const size = coverSize()
          if (!size) return
          const { stageW, stageH, imgW, imgH } = size
          const rangeX = imgW - stageW
          const rangeY = imgH - stageH
          const left = -rangeX * (pending.x / 100)
          const top = -rangeY * (pending.y / 100)
          img.style.width = imgW + 'px'
          img.style.height = imgH + 'px'
          img.style.left = left + 'px'
          img.style.top = top + 'px'
        }

        function setPosition(x, y) {
          pending = { x: Math.max(0, Math.min(100, x)), y: Math.max(0, Math.min(100, y)) }
          layout()
        }

        function setAspect(newAspect) {
          aspect = newAspect || 1
          stage.style.aspectRatio = String(aspect)
          layout()
        }

        img.addEventListener('load', layout)

        let dragging = false
        let dragStart = null

        stage.addEventListener('pointerdown', (event) => {
          const size = coverSize()
          if (!size) return
          dragging = true
          stage.classList.add('dragging')
          stage.setPointerCapture(event.pointerId)
          dragStart = { x: event.clientX, y: event.clientY, pending: { ...pending } }
        })

        stage.addEventListener('pointermove', (event) => {
          if (!dragging) return
          const size = coverSize()
          if (!size) return
          const rangeX = size.imgW - size.stageW
          const rangeY = size.imgH - size.stageH
          const dx = event.clientX - dragStart.x
          const dy = event.clientY - dragStart.y
          const dxPercent = rangeX > 0 ? -(dx / rangeX) * 100 : 0
          const dyPercent = rangeY > 0 ? -(dy / rangeY) * 100 : 0
          setPosition(dragStart.pending.x + dxPercent, dragStart.pending.y + dyPercent)
        })

        function stopDragging() {
          dragging = false
          stage.classList.remove('dragging')
        }

        stage.addEventListener('pointerup', stopDragging)
        stage.addEventListener('pointercancel', stopDragging)

        resetBtn.addEventListener('click', () => setPosition(50, 50))

        saveBtn.addEventListener('click', async () => {
          const token = getToken()
          if (!token) {
            setStatus(posStatus, 'Primero guarda tu token de GitHub arriba.', 'error')
            return
          }
          saveBtn.disabled = true
          setStatus(posStatus, 'Guardando…', '')
          try {
            await enqueueWrite(() =>
              updateJsonField(slot, token, (target) => {
                target.objectPosition = `${Math.round(pending.x)}% ${Math.round(pending.y)}%`
              }),
            )
            // Sin esto, si volvías a abrir "Centrar" en la misma visita (sin refrescar),
            // el recuadro regresaba a la última posición cargada al inicio, no a la que
            // acababas de guardar.
            onSave({ ...pending })
            setStatus(posStatus, 'Posición guardada — se publicará en unos minutos.', 'ok')
          } catch (error) {
            setStatus(posStatus, error.message || 'Ocurrió un error al guardar.', 'error')
          } finally {
            saveBtn.disabled = false
          }
        })

        return { panel, img, setPosition, layout, setAspect }
      }

      function renderSlot(slot) {
        const row = document.createElement('div')
        row.className = 'slot'

        const previewWrap = document.createElement('div')
        const previewImg = document.createElement('img')
        previewImg.className = 'thumb'
        previewImg.alt = slot.label
        previewImg.style.display = 'none'
        const emptyThumb = document.createElement('div')
        emptyThumb.className = 'thumb-empty'
        emptyThumb.textContent = 'Sin foto'
        previewWrap.appendChild(emptyThumb)
        previewWrap.appendChild(previewImg)

        const info = document.createElement('div')
        const labelEl = document.createElement('p')
        labelEl.className = 'slot-label'
        labelEl.textContent = slot.label
        const altEl = document.createElement('p')
        altEl.className = 'slot-alt'
        info.appendChild(labelEl)
        info.appendChild(altEl)

        const actions = document.createElement('div')
        actions.className = 'slot-actions'
        const fileInput = document.createElement('input')
        fileInput.type = 'file'
        fileInput.accept = 'image/*'
        const uploadBtn = document.createElement('button')
        uploadBtn.className = 'secondary'
        uploadBtn.textContent = 'Subir'
        const centerBtn = document.createElement('button')
        centerBtn.className = 'secondary'
        centerBtn.textContent = 'Centrar'
        const statusEl = document.createElement('p')
        statusEl.className = 'slot-status'
        actions.appendChild(fileInput)
        actions.appendChild(uploadBtn)
        actions.appendChild(centerBtn)
        actions.appendChild(statusEl)

        uploadBtn.addEventListener('click', () => {
          const file = fileInput.files[0]
          if (!file) {
            setStatus(statusEl, 'Elige una imagen primero.', 'error')
            return
          }
          uploadPhoto(slot, file, statusEl, previewImg, uploadBtn, emptyThumb, fileInput)
        })

        let currentPosition = { x: 50, y: 50 }
        const { panel: positionPanel, img: positionImg, setPosition, layout: positionLayout } = createPositionPanel(
          slot,
          (newPosition) => {
            currentPosition = newPosition
          },
        )

        centerBtn.addEventListener('click', () => {
          if (previewImg.style.display === 'none') {
            setStatus(statusEl, 'Sube una foto primero para poder centrarla.', 'error')
            return
          }
          const willOpen = !positionPanel.classList.contains('open')
          positionPanel.classList.toggle('open')
          if (willOpen) {
            positionImg.src = previewImg.src
            setPosition(currentPosition.x, currentPosition.y)
            requestAnimationFrame(() => requestAnimationFrame(positionLayout))
          }
        })

        row.appendChild(previewWrap)
        row.appendChild(info)
        row.appendChild(actions)
        row.appendChild(positionPanel)

        fetchJson(slot.file)
          .then((data) => {
            const target = walk(data, slot.path)
            if (target && target.src) {
              previewImg.src = SITE_ORIGIN + target.src
              previewImg.style.display = 'block'
              emptyThumb.style.display = 'none'
            }
            if (target && target.objectPosition) {
              currentPosition = parsePosition(target.objectPosition)
            }
            altEl.textContent = target && target.alt ? target.alt : ''
          })
          .catch(() => {
            altEl.textContent = 'No se pudo leer el estado actual.'
          })

        return row
      }

      function renderSlots() {
        const container = document.getElementById('slots')
        container.innerHTML = ''
        SLOTS.forEach((slot) => container.appendChild(renderSlot(slot)))
        container.classList.add('ready')
      }

      /** Fila de una foto del portafolio: subir/reemplazar, centrar, subtítulo y eliminar. */
      function renderPortfolioItem(item, displayNumber) {
        const row = document.createElement('div')
        row.className = 'slot'

        const previewWrap = document.createElement('div')
        const previewImg = document.createElement('img')
        previewImg.className = 'thumb'
        previewImg.alt = ''
        previewImg.style.display = 'none'
        const emptyThumb = document.createElement('div')
        emptyThumb.className = 'thumb-empty'
        emptyThumb.textContent = 'Sin foto'
        if (item.image.src) {
          previewImg.src = SITE_ORIGIN + item.image.src
          previewImg.style.display = 'block'
          emptyThumb.style.display = 'none'
        }
        previewWrap.appendChild(emptyThumb)
        previewWrap.appendChild(previewImg)

        const info = document.createElement('div')
        const labelEl = document.createElement('p')
        labelEl.className = 'slot-label'
        labelEl.textContent = 'Portafolio — Foto ' + displayNumber
        const altEl = document.createElement('p')
        altEl.className = 'slot-alt'
        altEl.textContent = item.image.label || '(sin subtítulo)'
        info.appendChild(labelEl)
        info.appendChild(altEl)

        const captionRow = document.createElement('div')
        captionRow.className = 'caption-row'
        const captionInput = document.createElement('input')
        captionInput.type = 'text'
        captionInput.placeholder = 'Subtítulo debajo de la foto'
        captionInput.value = item.image.label || ''
        const captionSaveBtn = document.createElement('button')
        captionSaveBtn.className = 'secondary'
        captionSaveBtn.textContent = 'Guardar subtítulo'
        captionRow.appendChild(captionInput)
        captionRow.appendChild(captionSaveBtn)
        info.appendChild(captionRow)

        const actions = document.createElement('div')
        actions.className = 'slot-actions'
        const fileInput = document.createElement('input')
        fileInput.type = 'file'
        fileInput.accept = 'image/*'
        const uploadBtn = document.createElement('button')
        uploadBtn.className = 'secondary'
        uploadBtn.textContent = 'Subir'
        const centerBtn = document.createElement('button')
        centerBtn.className = 'secondary'
        centerBtn.textContent = 'Centrar'
        const deleteBtn = document.createElement('button')
        deleteBtn.className = 'danger'
        deleteBtn.textContent = 'Eliminar foto'
        const statusEl = document.createElement('p')
        statusEl.className = 'slot-status'
        actions.appendChild(fileInput)
        actions.appendChild(uploadBtn)
        actions.appendChild(centerBtn)
        actions.appendChild(deleteBtn)
        actions.appendChild(statusEl)

        let orientation = item.orientation || 'vertical'
        const imageSlot = portfolioImageSlot(item.id, labelEl.textContent)

        let currentPosition = parsePosition(item.image.objectPosition)
        imageSlot.aspect = aspectForOrientation(orientation, item.size)
        const { panel: positionPanel, img: positionImg, setPosition, layout: positionLayout, setAspect } =
          createPositionPanel(imageSlot, (newPosition) => {
            currentPosition = newPosition
          })

        uploadBtn.addEventListener('click', async () => {
          const file = fileInput.files[0]
          if (!file) {
            setStatus(statusEl, 'Elige una imagen primero.', 'error')
            return
          }
          const detectedOrientation = await detectOrientation(file)
          uploadPhoto(imageSlot, file, statusEl, previewImg, uploadBtn, emptyThumb, fileInput).then(async () => {
            orientation = detectedOrientation
            setAspect(aspectForOrientation(orientation, item.size))
            const token = getToken()
            if (!token) return
            try {
              await enqueueWrite(() =>
                updateJsonField(portfolioItemSlot(item.id, 'orientación de la foto'), token, (found) => {
                  found.orientation = detectedOrientation
                }),
              )
            } catch (error) {
              // La foto ya se subió bien; si esto falla, en el peor caso el recuadro de
              // "Centrar" usa una proporción distinta hasta la próxima subida.
            }
          })
        })

        captionSaveBtn.addEventListener('click', async () => {
          const value = captionInput.value.trim()
          if (!value) {
            setStatus(statusEl, 'Escribe un subtítulo primero.', 'error')
            return
          }
          const token = getToken()
          if (!token) {
            setStatus(statusEl, 'Primero guarda tu token de GitHub arriba.', 'error')
            return
          }
          captionSaveBtn.disabled = true
          setStatus(statusEl, 'Guardando subtítulo…', '')
          try {
            await enqueueWrite(() => updateJsonField(imageSlot, token, (target) => {
              target.label = value
            }))
            altEl.textContent = value
            setStatus(statusEl, 'Subtítulo guardado — se publicará en unos minutos.', 'ok')
          } catch (error) {
            setStatus(statusEl, error.message || 'Ocurrió un error al guardar el subtítulo.', 'error')
          } finally {
            captionSaveBtn.disabled = false
          }
        })

        centerBtn.addEventListener('click', () => {
          if (previewImg.style.display === 'none') {
            setStatus(statusEl, 'Sube una foto primero para poder centrarla.', 'error')
            return
          }
          const willOpen = !positionPanel.classList.contains('open')
          positionPanel.classList.toggle('open')
          if (willOpen) {
            positionImg.src = previewImg.src
            setPosition(currentPosition.x, currentPosition.y)
            requestAnimationFrame(() => requestAnimationFrame(positionLayout))
          }
        })

        deleteBtn.addEventListener('click', async () => {
          const confirmed = window.confirm('¿Eliminar esta foto del portafolio? Ya no se publicará en el sitio.')
          if (!confirmed) return
          const token = getToken()
          if (!token) {
            setStatus(statusEl, 'Primero guarda tu token de GitHub arriba.', 'error')
            return
          }
          deleteBtn.disabled = true
          setStatus(statusEl, 'Eliminando…', '')
          try {
            await enqueueWrite(() =>
              updateJsonField(portfolioRootSlot('eliminar foto'), token, (root) => {
                const idx = (root.items || []).findIndex((i) => i.id === item.id)
                if (idx === -1) throw new Error('Esa foto ya no está en el portafolio (puede que se haya eliminado desde otro lado).')
                root.items.splice(idx, 1)
              }),
            )
            row.remove()
          } catch (error) {
            setStatus(statusEl, error.message || 'Ocurrió un error al eliminar.', 'error')
            deleteBtn.disabled = false
          }
        })

        row.appendChild(previewWrap)
        row.appendChild(info)
        row.appendChild(actions)
        row.appendChild(positionPanel)

        return row
      }

      let portfolioItemCounter = 0

      async function renderPortfolioSection() {
        const container = document.getElementById('portfolio-slots')
        container.innerHTML = 'Cargando portafolio…'
        try {
          const data = await fetchJson(PORTFOLIO_FILE)
          const items = data.items || []
          portfolioItemCounter = items.length
          container.innerHTML = ''
          items.forEach((item, index) => container.appendChild(renderPortfolioItem(item, index + 1)))
        } catch (error) {
          container.textContent = 'No se pudo leer el portafolio.'
        }
      }

      function renderAddPhotoBox() {
        const container = document.getElementById('portfolio-add')
        container.innerHTML = ''

        const box = document.createElement('div')
        box.className = 'add-photo-box'

        const hint = document.createElement('p')
        hint.className = 'add-photo-hint'
        hint.textContent = 'Elige la categoría de la foto nueva:'

        const picker = document.createElement('div')
        picker.className = 'category-picker'
        let selectedCategory = PORTFOLIO_CATEGORIES[0].value
        const categoryButtons = PORTFOLIO_CATEGORIES.map((cat) => {
          const btn = document.createElement('button')
          btn.type = 'button'
          btn.className = 'secondary' + (cat.value === selectedCategory ? ' selected' : '')
          btn.textContent = cat.label
          btn.addEventListener('click', () => {
            selectedCategory = cat.value
            categoryButtons.forEach((b) => b.classList.remove('selected'))
            btn.classList.add('selected')
          })
          picker.appendChild(btn)
          return btn
        })

        const sizeHint = document.createElement('p')
        sizeHint.className = 'add-photo-hint'
        sizeHint.textContent = 'Elige el tamaño en la cuadrícula:'

        const sizePicker = document.createElement('div')
        sizePicker.className = 'category-picker'
        let selectedSize = PORTFOLIO_SIZES[0].value
        const sizeButtons = PORTFOLIO_SIZES.map((s) => {
          const btn = document.createElement('button')
          btn.type = 'button'
          btn.className = 'secondary' + (s.value === selectedSize ? ' selected' : '')
          btn.textContent = s.label
          btn.addEventListener('click', () => {
            selectedSize = s.value
            sizeButtons.forEach((b) => b.classList.remove('selected'))
            btn.classList.add('selected')
          })
          sizePicker.appendChild(btn)
          return btn
        })

        const addBtn = document.createElement('button')
        addBtn.textContent = '+ Agregar foto'
        const statusEl = document.createElement('p')
        statusEl.className = 'slot-status'
        statusEl.style.textAlign = 'left'

        addBtn.addEventListener('click', async () => {
          const token = getToken()
          if (!token) {
            setStatus(statusEl, 'Primero guarda tu token de GitHub arriba.', 'error')
            return
          }
          addBtn.disabled = true
          setStatus(statusEl, 'Agregando…', '')
          const categoryLabel = PORTFOLIO_CATEGORIES.find((c) => c.value === selectedCategory).label
          const newItem = {
            id: 'p-' + Date.now(),
            category: selectedCategory,
            orientation: 'vertical',
            size: selectedSize,
            image: { src: '', alt: '', label: categoryLabel },
          }
          try {
            await enqueueWrite(() =>
              updateJsonField(portfolioRootSlot('agregar foto'), token, (root) => {
                if (!root.items) root.items = []
                root.items.push(newItem)
              }),
            )
            portfolioItemCounter += 1
            document.getElementById('portfolio-slots').appendChild(renderPortfolioItem(newItem, portfolioItemCounter))
            setStatus(statusEl, 'Foto agregada — súbele una imagen abajo.', 'ok')
          } catch (error) {
            setStatus(statusEl, error.message || 'Ocurrió un error al agregar la foto.', 'error')
          } finally {
            addBtn.disabled = false
          }
        })

        box.appendChild(hint)
        box.appendChild(picker)
        box.appendChild(sizeHint)
        box.appendChild(sizePicker)
        box.appendChild(addBtn)
        box.appendChild(statusEl)
        container.appendChild(box)
      }

      function updateTokenStatus() {
        const status = document.getElementById('token-status')
        status.textContent = getToken() ? 'Token guardado en este navegador.' : 'Todavía no hay un token guardado.'
      }

      document.getElementById('save-token').addEventListener('click', () => {
        const value = document.getElementById('token-input').value.trim()
        if (!value) return
        localStorage.setItem(TOKEN_KEY, value)
        document.getElementById('token-input').value = ''
        updateTokenStatus()
      })

      document.getElementById('token-toggle').addEventListener('click', () => {
        document.getElementById('token-box').classList.toggle('open')
      })

      updateTokenStatus()
      renderSlots()
      renderPortfolioSection()
      renderAddPhotoBox()

      // Freno simple para que no cualquiera se tope con el panel — no es seguridad real,
      // la subida en sí solo funciona con un token de GitHub válido.
      const ADMIN_PASSWORD = 'JOSIADMIN'
      const AUTH_KEY = 'josi_admin_authed'

      function unlock() {
        document.getElementById('password-gate').classList.add('hidden')
        document.getElementById('app-content').classList.remove('hidden')
      }

      if (localStorage.getItem(AUTH_KEY) === 'true') {
        unlock()
      } else {
        document.getElementById('password-submit').addEventListener('click', () => {
          const value = document.getElementById('password-input').value
          if (value === ADMIN_PASSWORD) {
            localStorage.setItem(AUTH_KEY, 'true')
            unlock()
          } else {
            document.getElementById('password-error').textContent = 'Contraseña incorrecta.'
          }
        })
        document.getElementById('password-input').addEventListener('keydown', (event) => {
          if (event.key === 'Enter') document.getElementById('password-submit').click()
        })
      }
    </script>
  </body>
</html>
